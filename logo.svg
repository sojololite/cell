<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#1a9c4d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo del logo -->
  <rect width="100" height="100" fill="url(#logoGradient)" rx="12" filter="url(#shadow)"/>
  
  <!-- Símbolo SC -->
  <text x="50" y="60" font-size="42" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="2">
    SC
  </text>
  
  <!-- Efecto de brillo -->
  <rect width="100" height="30" fill="white" fill-opacity="0.2" rx="12"/>
</svg>